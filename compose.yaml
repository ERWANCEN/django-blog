services:
  db:
    image: postgres:18
    container_name: blog-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql   # volume nommé = données persistantes
    healthcheck:
      # $$ = un $ "échappé" : c'est le shell DU CONTENEUR qui lira la variable
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: django-blog:dev
    pull_policy: build
    container_name: blog-web
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # attend que PostgreSQL soit VRAIMENT prêt

volumes:
  postgres_data:                      # déclaration du volume nommé